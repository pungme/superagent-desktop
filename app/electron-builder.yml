appId: dev.cove.app
productName: Cove
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!e2e/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!playwright.config.{js,ts}'
  - '!vitest.config.{js,ts}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/*'
asarUnpack:
  - resources/**
  # node-pty's spawn-helper must stay executable outside the asar
  - '**/node_modules/node-pty/**'
mac:
  category: public.app-category.developer-tools
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Cove does not use the camera.
  notarize: false
  target:
    - dmg
dmg:
  artifactName: Cove-${version}.${ext}
  title: Cove ${version}
win:
  executableName: Cove
nsis:
  artifactName: Cove-${version}-setup.${ext}
  shortcutName: Cove
  createDesktopShortcut: always
linux:
  target:
    - AppImage
  maintainer: cove
  category: Development
npmRebuild: false
