appId: dev.superagent.app
productName: SuperAgent
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!e2e/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!playwright.config.{js,ts}'
  - '!vitest.config.{js,ts}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/*'
asarUnpack:
  - resources/**
  # node-pty's spawn-helper must stay executable outside the asar
  - '**/node_modules/node-pty/**'
mac:
  category: public.app-category.developer-tools
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: SuperAgent does not use the camera.
    - NSMicrophoneUsageDescription: SuperAgent records your voice only while you hold the dictation key, and transcribes it on this Mac.
  notarize: false
  target:
    - dmg
dmg:
  artifactName: SuperAgent-${version}.${ext}
  title: SuperAgent ${version}
win:
  executableName: SuperAgent
nsis:
  artifactName: SuperAgent-${version}-setup.${ext}
  shortcutName: SuperAgent
  createDesktopShortcut: always
linux:
  target:
    - AppImage
  maintainer: superagent
  category: Development
npmRebuild: false
