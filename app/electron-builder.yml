appId: dev.superagent.app
productName: SuperAgent
# Auto-update feed: electron-updater reads this (via app-update.yml) and each build
# emits latest-mac.yml alongside the DMG. Public repo, so no token needed to check.
publish:
  provider: github
  owner: pungme
  repo: superagent-desktop
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!e2e/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!playwright.config.{js,ts}'
  - '!vitest.config.{js,ts}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/*'
asarUnpack:
  - resources/**
  # node-pty's spawn-helper must stay executable outside the asar
  - '**/node_modules/node-pty/**'
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: SuperAgent does not use the camera.
    - NSMicrophoneUsageDescription: SuperAgent records your voice only while you hold the dictation key, and transcribes it on this Mac.
  notarize: true
  target:
    - dmg
dmg:
  # Version-less on purpose: GitHub's /releases/latest/download/<name> needs an
  # exact filename, so a stable one is what lets the site link straight to the
  # current build instead of the releases page.
  artifactName: SuperAgent.${ext}
  title: SuperAgent ${version}
win:
  executableName: SuperAgent
nsis:
  artifactName: SuperAgent-${version}-setup.${ext}
  shortcutName: SuperAgent
  createDesktopShortcut: always
linux:
  target:
    - AppImage
  maintainer: superagent
  category: Development
npmRebuild: false
