<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SuperAgent — the page is the product</title>
<meta name="description" content="A Mac app that gives your agent a computer." />
<style>
/*
  CONCEPT 1 — "Desk".
  The landing page IS the thing being sold: a desktop you can actually use.
  Windows drag, stack, close; the dock reopens them. Nobody screenshots a
  desktop to prove it works — they move a window. So the visitor does.
*/
:root {
  --bg: #0e0f12;
  --deep: #08090b;
  --win: #17191e;
  --win-head: #1d2026;
  --ink: #f2f3f5;
  --muted: #9ba1ac;
  --faint: #656b76;
  --line: rgba(255,255,255,0.09);
  --accent: #d7a54a;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif;
  background: var(--deep);
  color: var(--ink);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

/* The desk surface: a slow, cheap gradient wash. No WebGL — 60fps is the
   point, and a still gradient with one drifting light does the same job. */
.desk {
  position: fixed; inset: 0;
  background:
    radial-gradient(120% 90% at 15% 0%, #1c2030 0%, transparent 55%),
    radial-gradient(100% 80% at 85% 100%, #221a24 0%, transparent 60%),
    var(--bg);
  overflow: hidden;
}
.glow {
  position: absolute; width: 60vw; height: 60vw; border-radius: 50%;
  background: radial-gradient(circle, rgba(215,165,74,0.10), transparent 65%);
  top: -18vw; left: 40vw; filter: blur(30px);
  animation: drift 34s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate(-22vw, 16vh) scale(1.15); } }

/* menu bar */
.menubar {
  position: fixed; top:0; left:0; right:0; height:30px; z-index: 500;
  display:flex; align-items:center; gap:18px; padding:0 14px;
  background: rgba(14,15,18,0.6); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
  font-size: 12.5px; color: var(--muted);
}
.menubar b { color: var(--ink); font-weight: 650; letter-spacing:-0.01em; }
.menubar .mark { width:15px; height:15px; border-radius:4px; }
.menubar .brand { display:flex; align-items:center; gap:8px; }
.menubar .right { margin-left:auto; font-variant-numeric: tabular-nums; }

/* windows */
.win {
  position: absolute; display:flex; flex-direction:column;
  background: var(--win); border:1px solid var(--line); border-radius:12px;
  box-shadow: 0 30px 70px -20px rgba(0,0,0,0.75), 0 2px 8px rgba(0,0,0,0.4);
  overflow: hidden; min-width: 260px;
  animation: pop .28s cubic-bezier(.2,1.3,.5,1) both;
}
@keyframes pop { from { opacity:0; transform: translateY(10px) scale(.97); } }
.win-head {
  height:34px; flex:0 0 auto; display:flex; align-items:center; gap:9px;
  padding:0 10px; background: var(--win-head); border-bottom:1px solid var(--line);
  cursor: grab; user-select:none;
}
.win-head:active { cursor: grabbing; }
.win-title { font-size:12.5px; font-weight:600; letter-spacing:-0.01em; }
.win-x {
  margin-left:auto; width:20px; height:20px; border:0; border-radius:6px;
  background:none; color:var(--faint); cursor:pointer; font-size:13px; line-height:1;
}
.win-x:hover { background: rgba(255,255,255,0.08); color: var(--ink); }
.win-body { padding:18px 20px 20px; overflow:auto; }
.win.on { box-shadow: 0 40px 90px -20px rgba(0,0,0,0.85), 0 0 0 1px rgba(215,165,74,0.25); }

/* content inside windows */
h1 { font-size: clamp(26px, 3.4vw, 40px); line-height:1.05; letter-spacing:-0.035em; font-weight:680; }
h1 em { font-style: normal; color: var(--accent); }
.lede { margin-top:12px; color: var(--muted); font-size:15px; line-height:1.55; max-width:44ch; }
.ctas { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
.btn {
  display:inline-block; padding:9px 16px; border-radius:9px; text-decoration:none;
  font-size:13.5px; font-weight:600; background: var(--ink); color:#111;
  transition: transform .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background:none; color:var(--ink); border:1px solid var(--line); }
.note { margin-top:14px; font-size:12px; color:var(--faint); font-family:var(--mono); }

.rows { display:flex; flex-direction:column; gap:14px; }
.row b { display:block; font-size:13.5px; font-weight:640; }
.row span { display:block; font-size:13px; color:var(--muted); line-height:1.5; margin-top:2px; }

.shot { width:100%; border-radius:8px; border:1px solid var(--line); display:block; }

/* dock */
.dock {
  position: fixed; left:50%; bottom:14px; transform: translateX(-50%); z-index:400;
  display:flex; gap:4px; padding:7px 9px; border-radius:16px;
  background: rgba(23,25,30,0.75); backdrop-filter: blur(20px);
  border:1px solid var(--line); box-shadow: 0 14px 40px rgba(0,0,0,0.5);
}
.dock button {
  width:56px; height:50px; border:0; border-radius:11px; background:none; cursor:pointer;
  color: var(--muted); display:grid; place-items:center; gap:3px; font-size:10.5px;
  transition: background .15s ease, color .15s ease, transform .15s ease;
}
.dock button:hover { background: rgba(255,255,255,0.07); color:var(--ink); transform: translateY(-3px); }
.dock svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
.dock .lit { position:absolute; }

.hint {
  position: fixed; left:50%; bottom:78px; transform:translateX(-50%); z-index:300;
  font-size:12px; color:var(--faint); font-family:var(--mono); letter-spacing:0.02em;
  pointer-events:none; transition: opacity .5s ease;
}

@media (max-width: 820px) {
  body { overflow:auto; }
  .desk { position:static; min-height:100%; padding:44px 14px 96px; }
  .win { position:static !important; width:auto !important; height:auto !important;
         margin:0 0 14px; animation:none; }
  .win-head { cursor:default; }
  .hint { display:none; }
}
@media (prefers-reduced-motion: reduce) {
  .glow { animation:none; } .win { animation:none; } .btn { transition:none; }
}
</style>
</head>
<body>
<div class="desk" id="desk">
  <div class="glow"></div>
</div>

<div class="menubar">
  <span class="brand"><img class="mark" src="../logo.png" alt="" /><b>SuperAgent</b></span>
  <span>File</span><span>Apps</span><span>View</span>
  <span class="right" id="clock"></span>
</div>

<div class="dock" id="dock"></div>
<p class="hint" id="hint">drag a window · close one · the dock brings it back</p>

<script>
const WINDOWS = {
  about: {
    title: 'SuperAgent', w: 520, h: 330, x: 0.07, y: 0.13,
    html: `<h1>Your agent needs<br /><em>a computer.</em></h1>
      <p class="lede">Not a terminal. A Mac app with a real browser it drives, an iPhone it can tap,
      a desk it keeps its work on — and a chat that survives a restart.</p>
      <div class="ctas">
        <a class="btn" href="https://github.com/pungme/superagent-desktop/releases/latest/download/SuperAgent.dmg">Download for Mac</a>
        <a class="btn ghost" href="https://github.com/pungme/superagent-desktop">Source</a>
      </div>
      <p class="note">free · open source · runs locally · your Claude subscription</p>`
  },
  browser: {
    title: 'Browser', w: 470, h: 320, x: 0.52, y: 0.09,
    html: `<img class="shot" src="../browser-view.png" alt="A live browser pane inside SuperAgent" loading="lazy" />
      <p class="lede" style="margin-top:14px">A real Chromium pane, not a screenshot service. Ask for a page and it
      opens beside the conversation — the agent reads it, clicks it, and you watch.</p>`
  },
  desk: {
    title: 'Desk', w: 430, h: 300, x: 0.30, y: 0.46,
    html: `<div class="rows">
        <div class="row"><b>An iPhone in the window</b><span>A real iOS Simulator, streamed from its own framebuffer. Tap and type included.</span></div>
        <div class="row"><b>Desktop &amp; phone at once</b><span>One page, two engines, one session — side by side on a single surface.</span></div>
        <div class="row"><b>A board Claude keeps</b><span>Cards move themselves as the work happens, and remember the conversation that raised them.</span></div>
      </div>`
  },
  quiet: {
    title: 'Quiet by default', w: 400, h: 250, x: 0.66, y: 0.52,
    html: `<div class="rows">
        <div class="row"><b>Never steals focus</b><span>Agents finish in the background. The window comes forward only when you ask it to.</span></div>
        <div class="row"><b>Survives restarts</b><span>Panes, open files, the active chat — where you left them, even through an update.</span></div>
        <div class="row"><b>Light on memory</b><span>Sessions start on your first message and wind down when idle.</span></div>
      </div>`
  }
}
const ICONS = {
  about: '<circle cx="12" cy="12" r="8.5"/><path d="M12 8.2v4.4l3 1.9"/>',
  browser: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.6 4.8 3.6 13.2 0 18M12 3C8.4 7.8 8.4 16.2 12 21"/>',
  desk: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/>',
  quiet: '<path d="M18 15.5V10a6 6 0 10-12 0v5.5L4.5 18h15z"/><path d="M10 21h4"/>'
}
const desk = document.getElementById('desk')
const dock = document.getElementById('dock')
const open = new Map()
let z = 10
const narrow = () => window.innerWidth <= 820

function place(el, cfg) {
  if (narrow()) return
  const W = window.innerWidth, H = window.innerHeight
  const w = Math.min(cfg.w, W - 40), h = Math.min(cfg.h, H - 120)
  el.style.width = w + 'px'
  el.style.height = h + 'px'
  el.style.left = Math.round(Math.min(Math.max(cfg.x * W, 12), W - w - 12)) + 'px'
  el.style.top = Math.round(Math.min(Math.max(cfg.y * H, 40), H - h - 80)) + 'px'
}

function focus(el) { el.style.zIndex = ++z; document.querySelectorAll('.win').forEach(w => w.classList.toggle('on', w === el)) }

function openWin(id) {
  if (open.has(id)) { focus(open.get(id)); return }
  const cfg = WINDOWS[id]
  const el = document.createElement('section')
  el.className = 'win'
  el.innerHTML = `<header class="win-head"><span class="win-title">${cfg.title}</span>
      <button class="win-x" aria-label="Close">✕</button></header>
    <div class="win-body">${cfg.html}</div>`
  desk.appendChild(el)
  place(el, cfg)
  focus(el)
  open.set(id, el)
  el.addEventListener('pointerdown', () => focus(el))
  el.querySelector('.win-x').addEventListener('click', () => { el.remove(); open.delete(id) })

  // Drag by the title bar. Pointer capture so a fast drag never drops the
  // window when the cursor outruns the element.
  const head = el.querySelector('.win-head')
  let from = null
  head.addEventListener('pointerdown', (e) => {
    if (narrow() || e.target.closest('.win-x')) return
    from = { x: e.clientX, y: e.clientY, left: el.offsetLeft, top: el.offsetTop }
    head.setPointerCapture(e.pointerId)
    document.getElementById('hint').style.opacity = '0'
  })
  head.addEventListener('pointermove', (e) => {
    if (!from) return
    const W = window.innerWidth, H = window.innerHeight
    el.style.left = Math.min(Math.max(from.left + e.clientX - from.x, -el.offsetWidth + 90), W - 90) + 'px'
    el.style.top = Math.min(Math.max(from.top + e.clientY - from.y, 30), H - 44) + 'px'
  })
  const stop = (e) => { if (from) { from = null; head.releasePointerCapture?.(e.pointerId) } }
  head.addEventListener('pointerup', stop)
  head.addEventListener('pointercancel', stop)
}

for (const [id, cfg] of Object.entries(WINDOWS)) {
  const b = document.createElement('button')
  b.title = cfg.title
  b.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[id]}</svg><span>${cfg.title.split(' ')[0]}</span>`
  b.addEventListener('click', () => openWin(id))
  dock.appendChild(b)
  openWin(id)
}

const clock = document.getElementById('clock')
const tick = () => clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
tick(); setInterval(tick, 20000)
window.addEventListener('resize', () => open.forEach((el, id) => place(el, WINDOWS[id])))
</script>
</body>
</html>
